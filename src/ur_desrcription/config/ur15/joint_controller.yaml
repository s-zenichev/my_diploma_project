controller_manager:
  ros__parameters:
      update_rate: 1000
      use_sim_time: true

      effort_controller:
        type: effort_controllers/JointGroupEffortController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

effort_controller:
  ros__parameters:
    publish_rate: 1000

    base_frame_id: world

    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

joint_state_broadcaster:
  ros__parameters:
      interfaces:
        - position
        - velocity
        - effort
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint