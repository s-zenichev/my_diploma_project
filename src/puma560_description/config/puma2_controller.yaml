puma2:
  controller_manager:
    ros__parameters:
        update_rate: 100
        use_sim_time: true

        effort_controller:
          type: effort_controllers/JointGroupEffortController

        joint_state_broadcaster:
          type: joint_state_broadcaster/JointStateBroadcaster

  puma2_effort_controller:
    ros__parameters:
      publish_rate: 100

      base_frame_id: world

      joints:
        - puma2_platform
        - puma2_shoulder
        - puma2_elbow
        - puma2_wrist_revolute
        - puma2_wrist_bend
        - puma2_effector_revolute

  puma2_joint_state_broadcaster:
    ros__parameters:
        interfaces:
          - position
          - velocity
        joints:
          - puma2_platform
          - puma2_shoulder
          - puma2_elbow
          - puma2_wrist_revolute
          - puma2_wrist_bend
          - puma2_effector_revolute
