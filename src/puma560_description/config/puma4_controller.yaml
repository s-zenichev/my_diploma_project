puma4:
  controller_manager:
    ros__parameters:
        update_rate: 100
        use_sim_time: true

        effort_controller:
          type: effort_controllers/JointGroupEffortController

        joint_state_broadcaster:
          type: joint_state_broadcaster/JointStateBroadcaster

  puma4_effort_controller:
    ros__parameters:
      publish_rate: 100

      base_frame_id: world

      joints:
        - puma4_platform
        - puma4_shoulder
        - puma4_elbow
        - puma4_wrist_revolute
        - puma4_wrist_bend
        - puma4_effector_revolute

  puma4_joint_state_broadcaster:
    ros__parameters:
        interfaces:
          - position
          - velocity
        joints:
          - puma4_platform
          - puma4_shoulder
          - puma4_elbow
          - puma4_wrist_revolute
          - puma4_wrist_bend
          - puma4_effector_revolute
