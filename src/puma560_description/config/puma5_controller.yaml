puma5:
  controller_manager:
    ros__parameters:
        update_rate: 100
        use_sim_time: true

        effort_controller:
          type: effort_controllers/JointGroupEffortController

        joint_state_broadcaster:
          type: joint_state_broadcaster/JointStateBroadcaster

  puma5_effort_controller:
    ros__parameters:
      publish_rate: 100

      base_frame_id: world

      joints:
        - puma5_platform
        - puma5_shoulder
        - puma5_elbow
        - puma5_wrist_revolute
        - puma5_wrist_bend
        - puma5_effector_revolute

  puma5_joint_state_broadcaster:
    ros__parameters:
        interfaces:
          - position
          - velocity
        joints:
          - puma5_platform
          - puma5_shoulder
          - puma5_elbow
          - puma5_wrist_revolute
          - puma5_wrist_bend
          - puma5_effector_revolute
