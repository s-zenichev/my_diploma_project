puma0:
  controller_manager:
    ros__parameters:
        update_rate: 100
        use_sim_time: true

        effort_controller:
          type: effort_controllers/JointGroupEffortController

        joint_state_broadcaster:
          type: joint_state_broadcaster/JointStateBroadcaster

  puma0_effort_controller:
    ros__parameters:
      publish_rate: 100

      base_frame_id: world

      joints:
        - puma0_platform
        - puma0_shoulder
        - puma0_elbow
        - puma0_wrist_revolute
        - puma0_wrist_bend
        - puma0_effector_revolute

  puma0_joint_state_broadcaster:
    ros__parameters:
        interfaces:
          - position
          - velocity
        joints:
          - puma0_platform
          - puma0_shoulder
          - puma0_elbow
          - puma0_wrist_revolute
          - puma0_wrist_bend
          - puma0_effector_revolute
