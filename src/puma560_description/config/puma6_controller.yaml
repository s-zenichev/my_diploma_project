puma6:
  controller_manager:
    ros__parameters:
        update_rate: 100
        use_sim_time: true

        effort_controller:
          type: effort_controllers/JointGroupEffortController

        joint_state_broadcaster:
          type: joint_state_broadcaster/JointStateBroadcaster

  puma6_effort_controller:
    ros__parameters:
      publish_rate: 100

      base_frame_id: world

      joints:
        - puma6_platform
        - puma6_shoulder
        - puma6_elbow
        - puma6_wrist_revolute
        - puma6_wrist_bend
        - puma6_effector_revolute

  puma6_joint_state_broadcaster:
    ros__parameters:
        interfaces:
          - position
          - velocity
        joints:
          - puma6_platform
          - puma6_shoulder
          - puma6_elbow
          - puma6_wrist_revolute
          - puma6_wrist_bend
          - puma6_effector_revolute
