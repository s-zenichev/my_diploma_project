puma3:
  controller_manager:
    ros__parameters:
        update_rate: 100
        use_sim_time: true

        effort_controller:
          type: effort_controllers/JointGroupEffortController

        joint_state_broadcaster:
          type: joint_state_broadcaster/JointStateBroadcaster

  puma3_effort_controller:
    ros__parameters:
      publish_rate: 100

      base_frame_id: world

      joints:
        - puma3_platform
        - puma3_shoulder
        - puma3_elbow
        - puma3_wrist_revolute
        - puma3_wrist_bend
        - puma3_effector_revolute

  puma3_joint_state_broadcaster:
    ros__parameters:
        interfaces:
          - position
          - velocity
        joints:
          - puma3_platform
          - puma3_shoulder
          - puma3_elbow
          - puma3_wrist_revolute
          - puma3_wrist_bend
          - puma3_effector_revolute
