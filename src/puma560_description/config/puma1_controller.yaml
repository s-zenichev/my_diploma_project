puma1:
  controller_manager:
    ros__parameters:
        update_rate: 100
        use_sim_time: true

        effort_controller:
          type: effort_controllers/JointGroupEffortController

        joint_state_broadcaster:
          type: joint_state_broadcaster/JointStateBroadcaster

  puma1_effort_controller:
    ros__parameters:
      publish_rate: 100

      base_frame_id: world

      joints:
        - puma1_platform
        - puma1_shoulder
        - puma1_elbow
        - puma1_wrist_revolute
        - puma1_wrist_bend
        - puma1_effector_revolute

  puma1_joint_state_broadcaster:
    ros__parameters:
        interfaces:
          - position
          - velocity
        joints:
          - puma1_platform
          - puma1_shoulder
          - puma1_elbow
          - puma1_wrist_revolute
          - puma1_wrist_bend
          - puma1_effector_revolute
